name: _netprobe

# 临时探针：只用来查清 runner 上 node 访问 jwc.qdu.edu.cn 到底卡在哪，查完即删。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 地址与代理
        run: |
          set +e
          echo "--- dns.lookup all ---"
          node -e "require('node:dns').lookup('jwc.qdu.edu.cn',{all:true},(e,a)=>console.log(e?('ERR '+e.code):JSON.stringify(a)))"
          sleep 3
          echo "--- 第二次（缓存后） ---"
          node -e "require('node:dns').lookup('jwc.qdu.edu.cn',{all:true},(e,a)=>console.log(e?('ERR '+e.code):JSON.stringify(a)))"
          echo "--- getent / getent ahostsv4 ---"
          getent ahostsv4 jwc.qdu.edu.cn || echo "ahostsv4 无结果"
          echo "--- 代理环境变量 ---"
          env | grep -iE 'proxy|no_proxy' || echo "无代理"

      - name: node:https family=4
        run: |
          set +e
          node -e "
          const https = require('node:https');
          const req = https.get('https://jwc.qdu.edu.cn/xxgk/kcap.htm',
            { family: 4, headers: { 'User-Agent': 'Mozilla/5.0' }, timeout: 20000 },
            (r) => { console.log('status=' + r.statusCode + ' ip=' + r.socket.remoteAddress); r.resume(); });
          req.on('timeout', () => { console.log('TIMEOUT ip=' + (req.socket && req.socket.remoteAddress)); req.destroy(); });
          req.on('error', (e) => console.log('FAIL ' + e.code + ' ' + e.message));
          "

      - name: fetch 各种姿势
        run: |
          set +e
          echo "--- 全局 fetch ---"
          node -e "
          fetch('https://jwc.qdu.edu.cn/xxgk/kcap.htm', { headers: { 'User-Agent': 'Mozilla/5.0' } })
            .then((r) => console.log('OK ' + r.status))
            .catch((e) => console.log('FAIL', e.message, '| cause:', e.cause?.code, e.cause?.message));
          "
          echo "--- ipv4first + 全局 fetch ---"
          node -e "
          require('node:dns').setDefaultResultOrder('ipv4first');
          fetch('https://jwc.qdu.edu.cn/xxgk/kcap.htm', { headers: { 'User-Agent': 'Mozilla/5.0' } })
            .then((r) => console.log('OK ' + r.status))
            .catch((e) => console.log('FAIL', e.message, '| cause:', e.cause?.code, e.cause?.message));
          "
          echo "--- fetch 指向 curl 解出来的 IPv4（--resolve 等价） ---"
          IP=$(getent ahostsv4 jwc.qdu.edu.cn | awk 'NR==1{print $1}')
          echo "IPv4 = $IP"
          node -e "
          const https = require('node:https');
          const req = https.request({ host: '$IP', port: 443, servername: 'jwc.qdu.edu.cn', path: '/xxgk/kcap.htm',
            headers: { Host: 'jwc.qdu.edu.cn', 'User-Agent': 'Mozilla/5.0' }, timeout: 20000 },
            (r) => { console.log('直连 IP status=' + r.statusCode); r.resume(); });
          req.on('timeout', () => { console.log('直连 IP TIMEOUT'); req.destroy(); });
          req.on('error', (e) => console.log('直连 IP FAIL ' + e.code));
          req.end();
          "
